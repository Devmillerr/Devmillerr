<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MILLER_ — Software a medida para negocios</title>
  <desc id="desc">Identidad de MILLER_ con un panel de operaciones conectado y flujos de datos animados.</desc>
  <style>
    .flow{stroke-dasharray:5 9;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(2.4)}}
    .blink{animation:blink 1.05s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite}
    @keyframes grow{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
    .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}.b5{animation-delay:1.2s}.b6{animation-delay:1.5s}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .f2{animation-delay:-2.5s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181B1D"/>
      <stop offset="1" stop-color="#090A0B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".45" r=".5">
      <stop offset="0" stop-color="#C7EF72" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#C7EF72" stop-opacity=".04"/>
      <stop offset="1" stop-color="#C7EF72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx=".08" cy=".1" r=".45">
      <stop offset="0" stop-color="#7FD8C0" stop-opacity=".10"/>
      <stop offset="1" stop-color="#7FD8C0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="gridFade" cx=".7" cy=".5" r=".6">
      <stop offset="0" stop-color="#FFF"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#gridFade)"/></mask>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9BEB8"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C7EF72"/>
      <stop offset="1" stop-color="#7FD8C0"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262A"/>
      <stop offset="1" stop-color="#16191B"/>
    </linearGradient>
    <linearGradient id="winStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7EF72" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#5A6062" stop-opacity=".8"/>
      <stop offset="1" stop-color="#2E3234"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7EF72" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C7EF72" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="360" fill="url(#glowL)"/>
    <path d="M0 359.5H1200" stroke="url(#lime)" stroke-opacity=".5"/>

    <!-- connection lines -->
    <path d="M640 92H700" stroke="#C7EF72" stroke-opacity=".6" stroke-width="1.5" class="flow"/>
    <path d="M1140 250H1172V318H980V298" fill="none" stroke="#C7EF72" stroke-opacity=".6" stroke-width="1.5" class="flow"/>
    <circle cx="640" cy="92" r="4" fill="#C7EF72"/><circle cx="640" cy="92" r="4" fill="#C7EF72" class="pulse"/>
    <circle cx="1172" cy="318" r="4" fill="#C7EF72"/><circle cx="1172" cy="318" r="4" fill="#C7EF72" class="pulse" style="animation-delay:1.2s"/>

    <!-- dashboard window -->
    <g transform="translate(700 48)">
      <rect width="440" height="250" rx="12" fill="url(#win)" stroke="url(#winStroke)" filter="url(#shadow)"/>
      <path d="M0 34H440" stroke="#2E3234"/>
      <circle cx="18" cy="17" r="4.5" fill="#3A3F41"/><circle cx="34" cy="17" r="4.5" fill="#3A3F41"/><circle cx="50" cy="17" r="4.5" fill="#C7EF72"/>
      <rect x="150" y="9" width="140" height="16" rx="8" fill="#111314"/>
      <text x="220" y="21" text-anchor="middle" fill="#8D928E" font-family="Consolas, Menlo, monospace" font-size="10">miller_/operaciones</text>

      <!-- sidebar -->
      <path d="M96 34V250" stroke="#2E3234"/>
      <rect x="10" y="48" width="76" height="20" rx="5" fill="#C7EF72" fill-opacity=".12"/>
      <rect x="10" y="48" width="3" height="20" rx="1.5" fill="#C7EF72"/>
      <path d="M20 58H70" stroke="#C7EF72" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 86H64M20 110H72M20 134H58M20 158H68" stroke="#4A5052" stroke-width="3" stroke-linecap="round"/>

      <!-- stat cards -->
      <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
        <rect x="110" y="48" width="98" height="52" rx="7" fill="#111314" stroke="#2E3234"/>
        <text x="121" y="66" fill="#8D928E" font-size="9.5" letter-spacing=".5">VENTAS</text>
        <path d="M121 84H170" stroke="#F2F2EE" stroke-width="5" stroke-linecap="round"/>
        <path d="M180 88l6-7 6 4 8-10" fill="none" stroke="#C7EF72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="218" y="48" width="98" height="52" rx="7" fill="#111314" stroke="#2E3234"/>
        <text x="229" y="66" fill="#8D928E" font-size="9.5" letter-spacing=".5">INVENTARIO</text>
        <path d="M229 84H262" stroke="#F2F2EE" stroke-width="5" stroke-linecap="round"/>
        <circle cx="296" cy="83" r="7" fill="none" stroke="#2E3234" stroke-width="3"/>
        <circle cx="296" cy="83" r="7" fill="none" stroke="#C7EF72" stroke-width="3" stroke-dasharray="30 44" transform="rotate(-90 296 83)"/>
        <rect x="326" y="48" width="102" height="52" rx="7" fill="#111314" stroke="#2E3234"/>
        <text x="337" y="66" fill="#8D928E" font-size="9.5" letter-spacing=".5">PAGOS</text>
        <path d="M337 84H376" stroke="#F2F2EE" stroke-width="5" stroke-linecap="round"/>
        <rect x="390" y="78" width="28" height="12" rx="6" fill="#C7EF72" fill-opacity=".15"/>
        <circle cx="398" cy="84" r="2.5" fill="#C7EF72"/>
        <path d="M404 84H412" stroke="#C7EF72" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- area chart -->
      <rect x="110" y="110" width="206" height="126" rx="7" fill="#111314" stroke="#2E3234"/>
      <path d="M122 140H304M122 170H304M122 200H304" stroke="#22262A"/>
      <path id="trend" d="M122 214C142 208 150 186 170 190S200 206 218 178 250 150 268 160 292 134 304 126" fill="none" stroke="#C7EF72" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M122 214C142 208 150 186 170 190S200 206 218 178 250 150 268 160 292 134 304 126V226H122Z" fill="url(#area)"/>
      <circle r="8" fill="#C7EF72" opacity=".35" filter="url(#soft)">
        <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#trend"/></animateMotion>
      </circle>
      <circle r="3.5" fill="#F2F2EE" stroke="#C7EF72" stroke-width="2">
        <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#trend"/></animateMotion>
      </circle>

      <!-- bars -->
      <rect x="326" y="110" width="102" height="126" rx="7" fill="#111314" stroke="#2E3234"/>
      <g fill="#C7EF72">
        <rect x="337" y="160" width="9" height="64" rx="2" fill-opacity=".45" class="bar"/>
        <rect x="351" y="145" width="9" height="79" rx="2" fill-opacity=".6" class="bar b2"/>
        <rect x="365" y="170" width="9" height="54" rx="2" fill-opacity=".45" class="bar b3"/>
        <rect x="379" y="135" width="9" height="89" rx="2" fill-opacity=".75" class="bar b4"/>
        <rect x="393" y="150" width="9" height="74" rx="2" fill-opacity=".6" class="bar b5"/>
        <rect x="407" y="125" width="9" height="99" rx="2" class="bar b6"/>
      </g>
    </g>

    <!-- floating chips -->
    <g class="float">
      <g transform="translate(612 196)" font-family="Consolas, Menlo, monospace">
        <rect width="138" height="38" rx="9" fill="#1B1E20" stroke="#3A3F41" filter="url(#shadow)"/>
        <rect x="10" y="10" width="18" height="18" rx="5" fill="#C7EF72" fill-opacity=".15"/>
        <path d="M14 19l3.5 3.5L24 15" fill="none" stroke="#C7EF72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="38" y="23.5" fill="#F2F2EE" font-size="11">API sync · OK</text>
      </g>
    </g>
    <g class="float f2">
      <g transform="translate(1036 22)" font-family="Consolas, Menlo, monospace">
        <rect width="128" height="34" rx="9" fill="#1B1E20" stroke="#3A3F41" filter="url(#shadow)"/>
        <circle cx="17" cy="17" r="4" fill="#C7EF72"/><circle cx="17" cy="17" r="4" fill="#C7EF72" class="pulse"/>
        <text x="30" y="21" fill="#F2F2EE" font-size="11">tareas auto ✓</text>
      </g>
    </g>

    <!-- identity -->
    <g transform="translate(60 56)">
      <rect width="232" height="30" rx="15" fill="#C7EF72" fill-opacity=".08" stroke="#C7EF72" stroke-opacity=".35"/>
      <circle cx="18" cy="15" r="4" fill="#C7EF72"/><circle cx="18" cy="15" r="4" fill="#C7EF72" class="pulse"/>
      <text x="32" y="19.5" fill="#C7EF72" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="2.5">SOFTWARE / AUTOMATION</text>

      <text x="-4" y="140" fill="url(#titleGrad)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-4">MILLER<tspan fill="url(#lime)" class="blink" letter-spacing="0">_</tspan></text>

      <text x="0" y="188" fill="#F2F2EE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600">Software a medida para negocios.</text>
      <text x="0" y="226" fill="#9EA39F" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5">Procesos claros <tspan fill="#C7EF72">·</tspan> Información conectada <tspan fill="#C7EF72">·</tspan> Sistemas útiles</text>

      <g transform="translate(0 256)" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5">
        <text x="0" y="12" fill="#C7EF72">$</text>
        <text x="16" y="12" fill="#8D928E">build <tspan fill="#5A6062">→</tspan> connect <tspan fill="#5A6062">→</tspan> improve</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
