<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Cómo trabajo</title>
  <desc id="desc">Proceso en cuatro pasos: entender el proceso, definir la solución, construir e integrar, y medir y evolucionar.</desc>
  <style>
    .flow{stroke-dasharray:6 10;animation:flow 1.5s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-32}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 4s ease-out infinite;opacity:0}
    @keyframes ring{0%{opacity:.8;transform:scale(1)}35%,100%{opacity:0;transform:scale(1.9)}}
    .r2{animation-delay:1s}.r3{animation-delay:2s}.r4{animation-delay:3s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{opacity:0}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#120F1F"/>
      <stop offset=".5" stop-color="#151127"/>
      <stop offset="1" stop-color="#120F1F"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A35CFF"/>
      <stop offset="1" stop-color="#D18BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#A35CFF" stop-opacity=".09"/>
      <stop offset="1" stop-color="#A35CFF" stop-opacity="0"/>
    </radialGradient>
    <g id="node">
      <circle r="27" fill="#0F0C18" stroke="#3A3350" stroke-width="1.5"/>
      <circle r="20" fill="#A35CFF" fill-opacity=".1" stroke="#A35CFF" stroke-opacity=".55"/>
    </g>
  </defs>
  <rect width="1200" height="190" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="190" rx="12" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="189" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>

  <path d="M150 62H1050" stroke="#29243A" stroke-width="2"/>
  <path d="M150 62H1050" stroke="url(#line)" stroke-width="2" class="flow"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 62)">
      <circle r="27" fill="none" stroke="#A35CFF" class="ring"/>
      <use href="#node"/>
      <g fill="none" stroke="#A35CFF" stroke-width="2" stroke-linecap="round"><circle cx="-2" cy="-2" r="7"/><path d="M3 3l6 6"/></g>
      <text y="62" fill="#635B7A" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">PASO 01</text>
      <text y="86" fill="#F5F3FA" font-size="18" font-weight="700">Entender el proceso</text>
      <text y="108" fill="#A69FBB" font-size="13">Cómo opera hoy el negocio.</text>
    </g>
    <g transform="translate(450 62)">
      <circle r="27" fill="none" stroke="#A35CFF" class="ring r2"/>
      <use href="#node"/>
      <g fill="none" stroke="#A35CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-9" width="18" height="18" rx="3"/><path d="M-4 -2h8M-4 3h5"/></g>
      <text y="62" fill="#635B7A" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">PASO 02</text>
      <text y="86" fill="#F5F3FA" font-size="18" font-weight="700">Definir la solución</text>
      <text y="108" fill="#A69FBB" font-size="13">Alcance que tenga sentido.</text>
    </g>
    <g transform="translate(750 62)">
      <circle r="27" fill="none" stroke="#A35CFF" class="ring r3"/>
      <use href="#node"/>
      <g fill="none" stroke="#A35CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-4 -7l-7 7 7 7M4 -7l7 7-7 7"/></g>
      <text y="62" fill="#635B7A" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">PASO 03</text>
      <text y="86" fill="#F5F3FA" font-size="18" font-weight="700">Construir e integrar</text>
      <text y="108" fill="#A69FBB" font-size="13">Entregas pequeñas y verificables.</text>
    </g>
    <g transform="translate(1050 62)">
      <circle r="27" fill="none" stroke="#A35CFF" class="ring r4"/>
      <circle r="27" fill="#0F0C18" stroke="#3A3350" stroke-width="1.5"/>
      <circle r="20" fill="#A35CFF"/>
      <path d="M-8 4l5-5 4 3 7-7" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="62" fill="#635B7A" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="2">PASO 04</text>
      <text y="86" fill="#F5F3FA" font-size="18" font-weight="700">Medir y evolucionar</text>
      <text y="108" fill="#A69FBB" font-size="13">Mejora continua del sistema.</text>
    </g>
  </g>
</svg>
