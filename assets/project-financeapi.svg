    <rect x="340" y="139" width="220" height="100" rx="6" fill="#202326" stroke="#555B5D"/>
    <text x="358" y="164" fill="#C7EF72" font-family="monospace" font-size="11">02 / DOMAIN</text>
    <text x="358" y="191" fill="#F2F2EE" font-size="19" font-weight="700">Reglas de negocio</text>
    <text x="358" y="214" fill="#A6AAA6" font-size="13">Importes e idempotencia</text>
    <rect x="652" y="139" width="220" height="100" rx="6" fill="#202326" stroke="#555B5D"/>
    <text x="670" y="164" fill="#C7EF72" font-family="monospace" font-size="11">03 / DATA</text>
    <text x="670" y="191" fill="#F2F2EE" font-size="19" font-weight="700">Persistencia</text>
    <text x="670" y="214" fill="#A6AAA6" font-size="13">PostgreSQL + Prisma</text>
