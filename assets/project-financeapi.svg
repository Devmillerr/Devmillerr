<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">FinanceApi — backend y reglas de negocio</title>
  <desc id="desc">Arquitectura de la API: petición validada, reglas de negocio con idempotencia y persistencia en PostgreSQL.</desc>
  <style>
    .flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    .pkt{animation:pkt 3s ease-in-out infinite}
    @keyframes pkt{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(490px);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D20"/>
      <stop offset="1" stop-color="#0D0F10"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".35" r=".55">
      <stop offset="0" stop-color="#C7EF72" stop-opacity=".13"/>
      <stop offset="1" stop-color="#C7EF72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272A"/>
      <stop offset="1" stop-color="#17191B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7EF72" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#3A3F41"/>
      <stop offset="1" stop-color="#2A2E30"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C7EF72"/>
      <stop offset="1" stop-color="#7FD8C0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="frame"><rect width="1200" height="330" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#glow)"/>
    <text x="1180" y="300" text-anchor="end" fill="#FFFFFF" fill-opacity=".03" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="240" font-weight="800">02</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="329" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- window bar -->
  <path d="M0 44H1200" stroke="#FFFFFF" stroke-opacity=".06"/>
  <circle cx="24" cy="22" r="5" fill="#3A3F41"/><circle cx="42" cy="22" r="5" fill="#3A3F41"/><circle cx="60" cy="22" r="5" fill="#C7EF72"/>
  <text x="84" y="26" fill="#6E7470" font-family="Consolas, Menlo, monospace" font-size="12">~/proyectos/financeapi</text>
  <rect x="1022" y="11" width="156" height="22" rx="11" fill="#C7EF72" fill-opacity=".08" stroke="#C7EF72" stroke-opacity=".35"/>
  <text x="1100" y="26" text-anchor="middle" fill="#C7EF72" font-family="Consolas, Menlo, monospace" font-size="10.5" letter-spacing="1.5">PROJECT / BACKEND</text>

  <!-- left column -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="90" fill="#C7EF72" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2">02 — PROYECTO PROPIO</text>
    <text x="38" y="136" fill="#F2F2EE" font-size="40" font-weight="800" letter-spacing="-1">FinanceApi</text>
    <text x="40" y="168" fill="#9EA39F" font-size="15">Reglas de negocio, datos consistentes</text>
    <text x="40" y="189" fill="#9EA39F" font-size="15">y operaciones seguras.</text>
    <g font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="middle">
      <rect x="40" y="216" width="66" height="26" rx="13" fill="#202326" stroke="#3A3F41"/><text x="73" y="233" fill="#D6DAD5">NestJS</text>
      <rect x="114" y="216" width="94" height="26" rx="13" fill="#202326" stroke="#3A3F41"/><text x="161" y="233" fill="#D6DAD5">TypeScript</text>
      <rect x="216" y="216" width="94" height="26" rx="13" fill="#202326" stroke="#3A3F41"/><text x="263" y="233" fill="#D6DAD5">PostgreSQL</text>
      <rect x="318" y="216" width="66" height="26" rx="13" fill="#202326" stroke="#3A3F41"/><text x="351" y="233" fill="#D6DAD5">Prisma</text>
      <rect x="40" y="250" width="48" height="26" rx="13" fill="#202326" stroke="#3A3F41"/><text x="64" y="267" fill="#D6DAD5">JWT</text>
    </g>
    <text x="40" y="306" fill="#6E7470" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5">● DEMO DISPONIBLE</text>
  </g>

  <!-- pipeline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M670 132H715M915 132H960" stroke="#2A2E30" stroke-width="2"/>
    <path d="M670 132H715M915 132H960" stroke="#C7EF72" stroke-width="2" class="flow"/>
    <g class="pkt"><circle cx="570" cy="132" r="7" fill="#C7EF72" filter="url(#soft)"/><circle cx="570" cy="132" r="3" fill="#F2F2EE"/></g>

    <g transform="translate(470 72)">
      <rect width="200" height="120" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#C7EF72" fill-opacity=".1" stroke="#C7EF72" stroke-opacity=".4"/>
      <path d="M28 27l-5 6 5 6M38 27l5 6-5 6" fill="none" stroke="#C7EF72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="184" y="30" text-anchor="end" fill="#5A6062" font-family="Consolas, Menlo, monospace" font-size="10.5">01 / REQUEST</text>
      <text x="16" y="80" fill="#F2F2EE" font-size="18" font-weight="700">API REST</text>
      <text x="16" y="102" fill="#9EA39F" font-size="12.5">Validación de entrada</text>
    </g>
    <g transform="translate(715 72)">
      <rect width="200" height="120" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#C7EF72" fill-opacity=".1" stroke="#C7EF72" stroke-opacity=".4"/>
      <path d="M33 23l8 4v6c0 5-3.5 8-8 9.5-4.5-1.5-8-4.5-8-9.5v-6z" fill="none" stroke="#C7EF72" stroke-width="2" stroke-linejoin="round"/>
      <path d="M29.5 33l2.5 2.5 4.5-5" fill="none" stroke="#C7EF72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="184" y="30" text-anchor="end" fill="#5A6062" font-family="Consolas, Menlo, monospace" font-size="10.5">02 / DOMAIN</text>
      <text x="16" y="80" fill="#F2F2EE" font-size="18" font-weight="700">Reglas de negocio</text>
      <text x="16" y="102" fill="#9EA39F" font-size="12.5">Importes e idempotencia</text>
    </g>
    <g transform="translate(960 72)">
      <rect width="200" height="120" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#C7EF72" fill-opacity=".1" stroke="#C7EF72" stroke-opacity=".4"/>
      <g fill="none" stroke="#C7EF72" stroke-width="2"><ellipse cx="33" cy="26" rx="8" ry="3"/><path d="M25 26v14c0 1.7 3.6 3 8 3s8-1.3 8-3V26M25 33c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
      <text x="184" y="30" text-anchor="end" fill="#5A6062" font-family="Consolas, Menlo, monospace" font-size="10.5">03 / DATA</text>
      <text x="16" y="80" fill="#F2F2EE" font-size="18" font-weight="700">Persistencia</text>
      <text x="16" y="102" fill="#9EA39F" font-size="12.5">PostgreSQL + Prisma</text>
    </g>
  </g>

  <!-- request snippet -->
  <g transform="translate(470 216)" font-family="Consolas, Menlo, monospace" font-size="12.5">
    <rect width="690" height="84" rx="10" fill="#0B0C0D" stroke="#2A2E30"/>
    <text x="18" y="30"><tspan fill="#C7EF72">POST</tspan><tspan fill="#D6DAD5"> /transactions</tspan><tspan fill="#5A6062">   Idempotency-Key: </tspan><tspan fill="#7FD8C0">"7f3a…"</tspan></text>
    <text x="18" y="56"><tspan fill="#5A6062">{ </tspan><tspan fill="#9EA39F">amount</tspan><tspan fill="#5A6062">: </tspan><tspan fill="#E8C872">125000</tspan><tspan fill="#5A6062"> }  // unidades enteras</tspan></text>
    <rect x="540" y="15" width="132" height="24" rx="12" fill="#C7EF72" fill-opacity=".12"/>
    <text x="606" y="31" text-anchor="middle" fill="#C7EF72" font-size="11.5">201 Created</text>
  </g>
</svg>
