<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">FinanceApi — backend y reglas de negocio</title>
  <desc id="desc">Arquitectura de la API: petición validada, reglas de negocio con idempotencia y persistencia en PostgreSQL.</desc>
  <style>
    .flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-28}}
    .pkt{animation:pkt 3s ease-in-out infinite}
    @keyframes pkt{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(490px);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151127"/>
      <stop offset="1" stop-color="#08070E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".7" cy=".35" r=".55">
      <stop offset="0" stop-color="#A35CFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#A35CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1A33"/>
      <stop offset="1" stop-color="#15121F"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A35CFF" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#3A3350"/>
      <stop offset="1" stop-color="#29243A"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A35CFF"/>
      <stop offset="1" stop-color="#D18BFF"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="frame"><rect width="1200" height="330" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#glow)"/>
    <text x="1180" y="300" text-anchor="end" fill="#FFFFFF" fill-opacity=".03" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="240" font-weight="800">02</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="329" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- window bar -->
  <path d="M0 44H1200" stroke="#FFFFFF" stroke-opacity=".06"/>
  <circle cx="24" cy="22" r="5" fill="#3A3350"/><circle cx="42" cy="22" r="5" fill="#3A3350"/><circle cx="60" cy="22" r="5" fill="#A35CFF"/>
  <text x="84" y="26" fill="#787090" font-family="Consolas, Menlo, monospace" font-size="12">~/proyectos/financeapi</text>
  <rect x="1022" y="11" width="156" height="22" rx="11" fill="#A35CFF" fill-opacity=".08" stroke="#A35CFF" stroke-opacity=".35"/>
  <text x="1100" y="26" text-anchor="middle" fill="#A35CFF" font-family="Consolas, Menlo, monospace" font-size="10.5" letter-spacing="1.5">PROJECT / BACKEND</text>

  <!-- left column -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="90" fill="#A35CFF" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2">02 — PROYECTO PROPIO</text>
    <text x="38" y="136" fill="#F5F3FA" font-size="40" font-weight="800" letter-spacing="-1">FinanceApi</text>
    <text x="40" y="168" fill="#A69FBB" font-size="15">Reglas de negocio, datos consistentes</text>
    <text x="40" y="189" fill="#A69FBB" font-size="15">y operaciones seguras.</text>
    <g font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="middle">
      <rect x="40" y="216" width="66" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="73" y="233" fill="#DCD7E8">NestJS</text>
      <rect x="114" y="216" width="94" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="161" y="233" fill="#DCD7E8">TypeScript</text>
      <rect x="216" y="216" width="94" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="263" y="233" fill="#DCD7E8">PostgreSQL</text>
      <rect x="318" y="216" width="66" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="351" y="233" fill="#DCD7E8">Prisma</text>
      <rect x="40" y="250" width="48" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="64" y="267" fill="#DCD7E8">JWT</text>
    </g>
    <text x="40" y="306" fill="#787090" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5">● DEMO DISPONIBLE</text>
  </g>

  <!-- pipeline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M670 132H715M915 132H960" stroke="#29243A" stroke-width="2"/>
    <path d="M670 132H715M915 132H960" stroke="#A35CFF" stroke-width="2" class="flow"/>
    <g class="pkt"><circle cx="570" cy="132" r="7" fill="#A35CFF" filter="url(#soft)"/><circle cx="570" cy="132" r="3" fill="#F5F3FA"/></g>

    <g transform="translate(470 72)">
      <rect width="200" height="120" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#A35CFF" fill-opacity=".1" stroke="#A35CFF" stroke-opacity=".4"/>
      <path d="M28 27l-5 6 5 6M38 27l5 6-5 6" fill="none" stroke="#A35CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="184" y="30" text-anchor="end" fill="#635B7A" font-family="Consolas, Menlo, monospace" font-size="10.5">01 / REQUEST</text>
      <text x="16" y="80" fill="#F5F3FA" font-size="18" font-weight="700">API REST</text>
      <text x="16" y="102" fill="#A69FBB" font-size="12.5">Validación de entrada</text>
    </g>
    <g transform="translate(715 72)">
      <rect width="200" height="120" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#A35CFF" fill-opacity=".1" stroke="#A35CFF" stroke-opacity=".4"/>
      <path d="M33 23l8 4v6c0 5-3.5 8-8 9.5-4.5-1.5-8-4.5-8-9.5v-6z" fill="none" stroke="#A35CFF" stroke-width="2" stroke-linejoin="round"/>
      <path d="M29.5 33l2.5 2.5 4.5-5" fill="none" stroke="#A35CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="184" y="30" text-anchor="end" fill="#635B7A" font-family="Consolas, Menlo, monospace" font-size="10.5">02 / DOMAIN</text>
      <text x="16" y="80" fill="#F5F3FA" font-size="18" font-weight="700">Reglas de negocio</text>
      <text x="16" y="102" fill="#A69FBB" font-size="12.5">Importes e idempotencia</text>
    </g>
    <g transform="translate(960 72)">
      <rect width="200" height="120" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="9" fill="#A35CFF" fill-opacity=".1" stroke="#A35CFF" stroke-opacity=".4"/>
      <g fill="none" stroke="#A35CFF" stroke-width="2"><ellipse cx="33" cy="26" rx="8" ry="3"/><path d="M25 26v14c0 1.7 3.6 3 8 3s8-1.3 8-3V26M25 33c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
      <text x="184" y="30" text-anchor="end" fill="#635B7A" font-family="Consolas, Menlo, monospace" font-size="10.5">03 / DATA</text>
      <text x="16" y="80" fill="#F5F3FA" font-size="18" font-weight="700">Persistencia</text>
      <text x="16" y="102" fill="#A69FBB" font-size="12.5">PostgreSQL + Prisma</text>
    </g>
  </g>

  <!-- request snippet -->
  <g transform="translate(470 216)" font-family="Consolas, Menlo, monospace" font-size="12.5">
    <rect width="690" height="84" rx="10" fill="#09080F" stroke="#29243A"/>
    <text x="18" y="30"><tspan fill="#A35CFF">POST</tspan><tspan fill="#DCD7E8"> /transactions</tspan><tspan fill="#635B7A">   Idempotency-Key: </tspan><tspan fill="#D18BFF">"7f3a…"</tspan></text>
    <text x="18" y="56"><tspan fill="#635B7A">{ </tspan><tspan fill="#A69FBB">amount</tspan><tspan fill="#635B7A">: </tspan><tspan fill="#E8C872">125000</tspan><tspan fill="#635B7A"> }  // unidades enteras</tspan></text>
    <rect x="540" y="15" width="132" height="24" rx="12" fill="#A35CFF" fill-opacity=".12"/>
    <text x="606" y="31" text-anchor="middle" fill="#A35CFF" font-size="11.5">201 Created</text>
  </g>
</svg>
