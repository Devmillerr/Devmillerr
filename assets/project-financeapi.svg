<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">FinanceApi — backend y reglas de negocio</title>
  <desc id="desc">Ilustración de arquitectura con API, lógica de negocio y persistencia de datos.</desc>
  <rect width="900" height="300" rx="8" fill="#111314" stroke="#343839"/>
  <text x="28" y="34" fill="#C7EF72" font-family="monospace" font-size="12" letter-spacing="2">PROJECT / BACKEND</text>
  <text x="28" y="72" fill="#F2F2EE" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">FinanceApi</text>
  <text x="28" y="99" fill="#A6AAA6" font-family="Arial, Helvetica, sans-serif" font-size="15">Reglas de negocio · datos consistentes · APIs</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="28" y="139" width="220" height="100" rx="6" fill="#202326" stroke="#555B5D"/>
    <text x="46" y="164" fill="#C7EF72" font-family="monospace" font-size="11">01 / REQUEST</text>
    <text x="46" y="191" fill="#F2F2EE" font-size="19" font-weight="700">API REST</text>
