<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Sistema de gestión para lubricentro y lavado</title>
  <desc id="desc">Diagrama de operaciones conectadas a un sistema central: vehículos, inventario, ventas y lavados, y compras.</desc>
  <style>
    .flow{stroke-dasharray:5 8;animation:flow 1.3s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-26}}
    .rev{animation-direction:reverse}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:0;transform:scale(1.35)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151127"/>
      <stop offset="1" stop-color="#08070E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".68" cy=".55" r=".45">
      <stop offset="0" stop-color="#A35CFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#A35CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1A33"/>
      <stop offset="1" stop-color="#15121F"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A35CFF" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#3A3350"/>
      <stop offset="1" stop-color="#29243A"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A2CFC"/>
      <stop offset="1" stop-color="#AA34FC"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="coreGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#A35CFF" flood-opacity=".45"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <text x="440" y="320" text-anchor="end" fill="#FFFFFF" fill-opacity=".03" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="240" font-weight="800">01</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <path d="M0 44H1200" stroke="#FFFFFF" stroke-opacity=".06"/>
  <circle cx="24" cy="22" r="5" fill="#3A3350"/><circle cx="42" cy="22" r="5" fill="#3A3350"/><circle cx="60" cy="22" r="5" fill="#A35CFF"/>
  <text x="84" y="26" fill="#787090" font-family="Consolas, Menlo, monospace" font-size="12"></text>
  <rect x="1012" y="11" width="166" height="22" rx="11" fill="#A35CFF" fill-opacity=".08" stroke="#A35CFF" stroke-opacity=".35"/>
  <text x="1095" y="26" text-anchor="middle" fill="#A35CFF" font-family="Consolas, Menlo, monospace" font-size="10.5" letter-spacing="1.5">CASE / OPERATION</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="90" fill="#A35CFF" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2"></text>
    <text x="38" y="132" fill="#F5F3FA" font-size="34" font-weight="800" letter-spacing="-1">Gestión para</text>
    <text x="38" y="170" fill="#F5F3FA" font-size="34" font-weight="800" letter-spacing="-1">lubricentro y lavado</text>
    <text x="40" y="202" fill="#A69FBB" font-size="15">Operaciones relacionadas en un mismo sistema.</text>
    <g font-family="Consolas, Menlo, monospace" font-size="12" text-anchor="middle">
      <rect x="40" y="228" width="73" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="76.5" y="245" fill="#DCD7E8">Next.js</text>
      <rect x="121" y="228" width="48" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="145" y="245" fill="#DCD7E8">PWA</text>
      <rect x="177" y="228" width="66" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="210" y="245" fill="#DCD7E8">NestJS</text>
      <rect x="251" y="228" width="94" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="298" y="245" fill="#DCD7E8">PostgreSQL</text>
      <rect x="353" y="228" width="66" height="26" rx="13" fill="#1D1929" stroke="#3A3350"/><text x="386" y="245" fill="#DCD7E8">Prisma</text>
    </g>
    <text x="40" y="310" fill="#787090" font-family="Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5">● CASO ANONIMIZADO</text>
  </g>

  <!-- hub connections -->
  <g fill="none" stroke-width="2">
    <path d="M670 109C710 109 700 180 740 180M960 109C920 109 930 180 890 180M670 271C710 271 700 200 740 200M960 271C920 271 930 200 890 200" stroke="#29243A"/>
    <path d="M670 109C710 109 700 180 740 180M960 271C920 271 930 200 890 200" stroke="#A35CFF" class="flow"/>
    <path d="M960 109C920 109 930 180 890 180M670 271C710 271 700 200 740 200" stroke="#D18BFF" stroke-opacity=".8" class="flow rev"/>
  </g>

  <!-- core -->
  <g transform="translate(740 158)">
    <rect width="150" height="64" rx="14" fill="none" stroke="#A35CFF" stroke-width="2" class="pulse"/>
    <rect width="150" height="64" rx="14" fill="url(#core)" filter="url(#coreGlow)"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2"><ellipse cx="30" cy="24" rx="9" ry="3.5"/><path d="M21 24v15c0 2 4 3.5 9 3.5s9-1.5 9-3.5V24M21 31.5c0 2 4 3.5 9 3.5s9-1.5 9-3.5"/></g>
    <text x="52" y="30" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Sistema</text>
    <text x="52" y="47" fill="#FFFFFF" fill-opacity=".8" font-family="Consolas, Menlo, monospace" font-size="10.5">datos únicos</text>
  </g>

  <!-- modules -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(470 72)">
      <rect width="200" height="74" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="14" y="20" width="34" height="34" rx="9" fill="#A35CFF" fill-opacity=".1" stroke="#A35CFF" stroke-opacity=".4"/>
      <g fill="none" stroke="#A35CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 41v-5l3-6h12l3 6v5zM21 36h18"/><circle cx="25.5" cy="41" r="2"/><circle cx="34.5" cy="41" r="2"/></g>
      <text x="60" y="35" fill="#F5F3FA" font-size="16" font-weight="700">Vehículos</text>
      <text x="60" y="54" fill="#A69FBB" font-size="11.5">Historial y mantenimiento</text>
    </g>
    <g transform="translate(960 72)">
      <rect width="200" height="74" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="14" y="20" width="34" height="34" rx="9" fill="#A35CFF" fill-opacity=".1" stroke="#A35CFF" stroke-opacity=".4"/>
      <g fill="none" stroke="#A35CFF" stroke-width="2" stroke-linejoin="round"><path d="M31 27l9 4.5v9L31 45l-9-4.5v-9z"/><path d="M22 31.5l9 4.5 9-4.5M31 36v9"/></g>
      <text x="60" y="35" fill="#F5F3FA" font-size="16" font-weight="700">Inventario</text>
      <text x="60" y="54" fill="#A69FBB" font-size="11.5">Productos y movimientos</text>
    </g>
    <g transform="translate(470 234)">
      <rect width="200" height="74" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="14" y="20" width="34" height="34" rx="9" fill="#A35CFF" fill-opacity=".1" stroke="#A35CFF" stroke-opacity=".4"/>
      <g fill="none" stroke="#A35CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M31 27c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/></g>
      <text x="60" y="35" fill="#F5F3FA" font-size="16" font-weight="700">Ventas y lavados</text>
      <text x="60" y="54" fill="#A69FBB" font-size="11.5">Registro de servicios</text>
    </g>
    <g transform="translate(960 234)">
      <rect width="200" height="74" rx="12" fill="url(#node)" stroke="url(#edge)" filter="url(#shadow)"/>
      <rect x="14" y="20" width="34" height="34" rx="9" fill="#A35CFF" fill-opacity=".1" stroke="#A35CFF" stroke-opacity=".4"/>
      <g fill="none" stroke="#A35CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 28h3l3 12h10l2.5-8H25.5"/><circle cx="28" cy="44" r="1.6"/><circle cx="36" cy="44" r="1.6"/></g>
      <text x="60" y="35" fill="#F5F3FA" font-size="16" font-weight="700">Compras</text>
      <text x="60" y="54" fill="#A69FBB" font-size="11.5">Proveedores y pagos</text>
    </g>
  </g>
</svg>
