<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Experiencia profesional — Camposol S.A.</title>
  <desc id="desc">Analista de implementación digital en Camposol S.A.: análisis de requerimientos operativos, reglas de negocio, validación funcional con dispositivos PDA y digitalización de formatos de trabajo.</desc>
  <style>
    .scan{animation:scan 3s ease-in-out infinite}
    @keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(62px)}}
    .tick{opacity:.15;animation:tick 6s ease-in-out infinite}
    .t2{animation-name:tick2}.t3{animation-name:tick3}.t4{animation-name:tick4}
    @keyframes tick{0%,8%{opacity:.15}12%,90%{opacity:1}100%{opacity:.15}}
    @keyframes tick2{0%,28%{opacity:.15}32%,90%{opacity:1}100%{opacity:.15}}
    @keyframes tick3{0%,48%{opacity:.15}52%,90%{opacity:1}100%{opacity:.15}}
    @keyframes tick4{0%,68%{opacity:.15}72%,90%{opacity:1}100%{opacity:.15}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(2.4)}}
    .flow{stroke-dasharray:4 7;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-22}}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{opacity:1}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171329"/>
      <stop offset="1" stop-color="#08070E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".45" r=".4">
      <stop offset="0" stop-color="#A35CFF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#A35CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A35CFF"/>
      <stop offset="1" stop-color="#D18BFF"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262040"/>
      <stop offset="1" stop-color="#15121F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A35CFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#A35CFF" stop-opacity=".45"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="260" rx="14"/></clipPath>
    <clipPath id="screen"><rect x="14" y="30" width="112" height="96" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
    <rect width="6" height="260" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="259" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- timeline marker -->
    <path d="M58 72V214" stroke="#29243A" stroke-width="2"/>
    <path d="M58 72V214" stroke="#A35CFF" stroke-width="2" class="flow"/>
    <circle cx="58" cy="60" r="12" fill="#110E1C" stroke="#A35CFF" stroke-width="2"/>
    <circle cx="58" cy="60" r="5" fill="#A35CFF"/><circle cx="58" cy="60" r="5" fill="#A35CFF" class="pulse"/>

    <text x="90" y="52" fill="#A35CFF" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2.5">EXPERIENCIA PROFESIONAL</text>
    <text x="88" y="92" fill="#F5F3FA" font-size="30" font-weight="800" letter-spacing="-.5">Analista de implementación digital</text>
    <text x="90" y="120" fill="#D0CAE0" font-size="17" font-weight="600">Camposol S.A.</text>

    <text x="90" y="154" fill="#A69FBB" font-size="14">Requerimientos operativos convertidos en procesos digitales validados en campo.</text>

    <g font-family="Consolas, Menlo, monospace" font-size="11.5" text-anchor="middle">
      <rect x="90" y="176" width="194" height="28" rx="14" fill="#1D1929" stroke="#3A3350"/><text x="187" y="194" fill="#DCD7E8">Requerimientos operativos</text>
      <rect x="292" y="176" width="140" height="28" rx="14" fill="#1D1929" stroke="#3A3350"/><text x="362" y="194" fill="#DCD7E8">Reglas de negocio</text>
      <rect x="440" y="176" width="176" height="28" rx="14" fill="#1D1929" stroke="#3A3350"/><text x="528" y="194" fill="#DCD7E8">Validación con PDA</text>
      <rect x="624" y="176" width="192" height="28" rx="14" fill="#1D1929" stroke="#3A3350"/><text x="720" y="194" fill="#DCD7E8">Digitalización de formatos</text>
    </g>
  </g>

  <!-- PDA device -->
  <g class="float">
    <g transform="translate(960 40)">
      <rect width="140" height="190" rx="18" fill="url(#device)" stroke="#3A3350" filter="url(#shadow)"/>
      <rect x="54" y="12" width="32" height="5" rx="2.5" fill="#3A3350"/>
      <rect x="14" y="30" width="112" height="96" rx="6" fill="#0D0B15" stroke="#29243A"/>
      <g clip-path="url(#screen)" font-family="Consolas, Menlo, monospace" font-size="8.5">
        <text x="22" y="44" fill="#635B7A">FORMATO 04</text>
        <g class="tick"><rect x="22" y="52" width="10" height="10" rx="2" fill="#A35CFF"/><path d="M24.5 57l2 2 3.5-4" fill="none" stroke="#FFF" stroke-width="1.5"/></g><rect x="38" y="55" width="70" height="4" rx="2" fill="#3A3350"/>
        <g class="tick t2"><rect x="22" y="68" width="10" height="10" rx="2" fill="#A35CFF"/><path d="M24.5 73l2 2 3.5-4" fill="none" stroke="#FFF" stroke-width="1.5"/></g><rect x="38" y="71" width="58" height="4" rx="2" fill="#3A3350"/>
        <g class="tick t3"><rect x="22" y="84" width="10" height="10" rx="2" fill="#A35CFF"/><path d="M24.5 89l2 2 3.5-4" fill="none" stroke="#FFF" stroke-width="1.5"/></g><rect x="38" y="87" width="76" height="4" rx="2" fill="#3A3350"/>
        <g class="tick t4"><rect x="22" y="100" width="10" height="10" rx="2" fill="#A35CFF"/><path d="M24.5 105l2 2 3.5-4" fill="none" stroke="#FFF" stroke-width="1.5"/></g><rect x="38" y="103" width="50" height="4" rx="2" fill="#3A3350"/>
        <g class="scan"><rect x="14" y="20" width="112" height="16" fill="url(#beam)"/><rect x="14" y="36" width="112" height="1.5" fill="#D18BFF"/></g>
      </g>
      <g fill="#29243A">
        <rect x="18" y="140" width="30" height="14" rx="4"/><rect x="55" y="140" width="30" height="14" rx="4"/><rect x="92" y="140" width="30" height="14" rx="4"/>
        <rect x="18" y="160" width="30" height="14" rx="4"/><rect x="55" y="160" width="30" height="14" rx="4" fill="#A35CFF"/><rect x="92" y="160" width="30" height="14" rx="4"/>
      </g>
    </g>
  </g>
  <g transform="translate(856 92)" font-family="Consolas, Menlo, monospace">
    <path d="M86 18H104" stroke="#A35CFF" stroke-width="1.5" class="flow"/>
    <rect width="86" height="36" rx="9" fill="#1A1626" stroke="#3A3350"/>
    <circle cx="16" cy="18" r="4" fill="#A35CFF"/><circle cx="16" cy="18" r="4" fill="#A35CFF" class="pulse"/>
    <text x="28" y="22" fill="#F5F3FA" font-size="11">validado</text>
  </g>
</svg>
