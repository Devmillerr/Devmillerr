<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="178" viewBox="0 0 1200 178" role="img" aria-labelledby="title desc">
  <title id="title">Capacidades de MILLER_</title>
  <desc id="desc">Cuatro áreas: sistemas a medida, automatización, integración de datos y aplicaciones web.</desc>
  <rect width="1200" height="178" rx="6" fill="#111314" stroke="#343839"/>
  <g font-family="Arial, Helvetica, sans-serif">
