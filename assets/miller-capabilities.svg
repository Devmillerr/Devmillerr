      <text x="0" y="13" fill="#C7EF72" font-size="12" font-family="monospace">01 / BUILD</text>
      <text x="0" y="48" fill="#F2F2EE" font-size="21" font-weight="700">Sistemas a medida</text>
      <text x="0" y="76" fill="#A6AAA6" font-size="14">Módulos adaptados al proceso.</text>
      <path d="M0 105H245" stroke="#454A4A"/>
      <path d="M0 120H170" stroke="#454A4A"/>
      <path d="M0 135H205" stroke="#C7EF72" stroke-opacity=".8"/>
