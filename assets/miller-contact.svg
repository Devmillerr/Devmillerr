<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Hablemos de tu proceso</title>
  <desc id="desc">Invitación a conversar sobre un proyecto de software a medida.</desc>
  <style>
    .shine{animation:shine 3.5s ease-in-out infinite}
    @keyframes shine{0%{transform:translateX(-120px)}60%,100%{transform:translateX(260px)}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.9;transform:scale(2.4)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171329"/>
      <stop offset="1" stop-color="#08070E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".88" cy=".5" r=".45">
      <stop offset="0" stop-color="#A35CFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#A35CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A2CFC"/>
      <stop offset="1" stop-color="#AA34FC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A35CFF"/>
      <stop offset="1" stop-color="#D18BFF"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#A35CFF" flood-opacity=".28"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="180" rx="14"/></clipPath>
    <clipPath id="btn"><rect width="220" height="58" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="180" fill="url(#bg)"/>
    <rect x="700" width="500" height="180" fill="url(#dots)"/>
    <rect width="1200" height="180" fill="url(#glow)"/>
    <rect width="6" height="180" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="179" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <g transform="translate(46 0)">
    <circle cx="6" cy="50" r="4" fill="#A35CFF"/><circle cx="6" cy="50" r="4" fill="#A35CFF" class="pulse"/>
    <text x="20" y="54.5" fill="#A35CFF" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="2.5">LET'S BUILD SOMETHING USEFUL</text>
    <text x="0" y="100" fill="#F5F3FA" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">¿Qué proceso de tu negocio necesitas mejorar?</text>
    <text x="0" y="132" fill="#A69FBB" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Cuéntame el problema. Evaluemos una solución que tenga sentido.</text>
  </g>

  <g transform="translate(934 61)">
    <rect width="220" height="58" rx="12" fill="url(#lime)" filter="url(#shadow)"/>
    <g clip-path="url(#btn)"><rect width="60" height="58" fill="url(#shineGrad)" class="shine"/></g>
    <text x="30" y="35" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Escríbeme</text>
    <g class="nudge">
      <path d="M152 29H186M176 19L186 29L176 39" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
